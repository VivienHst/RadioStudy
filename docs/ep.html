<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逐字稿 · RiRadio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/ep.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./"><b>RiRadio</b><span>聽廣播學日文</span></a>
    <nav><a href="./">集數</a><a href="words.html">單字庫</a></nav>
  </div>
</header>

<main class="wrap">
  <section class="ep-head" id="ep-head"><p class="eyebrow">載入中…</p></section>

  <div class="pane-switch" role="tablist" id="pane-switch">
    <button role="tab" data-pane="transcript" aria-selected="true">逐字稿</button>
    <button role="tab" data-pane="notes" aria-selected="false">學習筆記</button>
  </div>

  <div class="ep-grid" id="ep-grid" data-pane="transcript">
    <div class="transcript-col">
      <div class="toolbar" id="toolbar">
        <div class="tb-group"><span class="tb-label">中文</span>
          <div class="seg" data-pref="zh"><button data-v="show">顯示</button><button data-v="tap">點了才顯示</button><button data-v="hide">隱藏</button></div>
        </div>
        <div class="tb-group"><span class="tb-label">振假名</span>
          <div class="seg" data-pref="rt"><button data-v="show">顯示</button><button data-v="hover">滑過顯示</button><button data-v="hide">隱藏</button></div>
        </div>
        <div class="tb-group"><span class="tb-label">標示</span>
          <div class="chips" id="hl-chips">
            <button class="chip lv-n1" data-k="N1">N1</button>
            <button class="chip lv-n2" data-k="N2">N2</button>
            <button class="chip lv-n3" data-k="N3">N3</button>
            <button class="chip lv-n4" data-k="N4-5">N4・N5</button>
            <button class="chip k-g" data-k="g">文法</button>
            <button class="chip k-i" data-k="i">慣用句</button>
            <button class="chip k-o" data-k="o">擬聲語</button>
          </div>
        </div>
        <div class="tb-group tb-search"><input class="search" type="search" id="q" placeholder="搜尋這集的日文或中文…" aria-label="搜尋這集"></div>
      </div>
      <p class="search-info" id="search-info" hidden></p>
      <section class="transcript" id="transcript" aria-label="逐字稿"></section>
    </div>
    <aside class="notes" id="notes" aria-label="學習筆記"></aside>
  </div>
</main>

<div class="pop" id="pop" role="dialog" hidden></div>

<footer class="site-footer">
  <div class="wrap">
    <p>非官方的個人學習筆記。節目內容版權屬於原權利人；字幕由語音辨識產生後人工修正，仍可能有錯。</p>
    <p>日檢級數參考舊制出題基準與常見單字書，僅供參考。</p>
  </div>
</footer>
</body>
</html>
