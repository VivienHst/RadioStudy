<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>單字庫 · RiRadio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/words.js"></script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="./"><b>RiRadio</b><span>聽廣播學日文</span></a>
    <nav><a href="./">集數</a><a href="words.html" aria-current="page">單字庫</a></nav>
  </div>
</header>

<main class="wrap">
  <section class="words-head">
    <h1>單字庫</h1>
    <p class="eyebrow" id="summary">載入中…</p>
  </section>

  <div class="words-tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="vocab">單字</button>
    <button role="tab" data-tab="grammar">文法</button>
    <button role="tab" data-tab="idioms">慣用句</button>
    <button role="tab" data-tab="onomatopoeia">擬聲擬態語</button>
    <button role="tab" data-tab="cards">單字卡</button>
  </div>

  <div class="filters" id="filters">
    <input class="search" type="search" id="q" placeholder="搜尋單字、讀音或中文…" aria-label="搜尋">
    <div class="chips" id="lv-chips">
      <button class="chip lv-n1" data-lv="N1">N1</button>
      <button class="chip lv-n2" data-lv="N2">N2</button>
      <button class="chip lv-n3" data-lv="N3">N3</button>
      <button class="chip lv-n4" data-lv="N4-5">N4・N5</button>
    </div>
    <label class="check" id="hk-wrap"><input type="checkbox" id="hide-known"> 隱藏已會</label>
    <select id="sort" aria-label="排序">
      <option value="level">依級數</option>
      <option value="freq">依出現次數</option>
      <option value="kana">依讀音</option>
    </select>
  </div>
  <p class="result-count" id="count"></p>
  <div id="list"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>「已會」的標記只存在這個瀏覽器裡，換裝置或清除網站資料就會消失。</p>
    <p>日檢級數參考舊制出題基準與常見單字書，僅供參考。</p>
  </div>
</footer>
</body>
</html>
